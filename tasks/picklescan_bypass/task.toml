schema_version = "1.4"
artifacts = []

[task]
name = "arim/picklescan_bypass"
version = "1.0.0"
description = "Locate and fix the real detection-bypass gap (CVE-2025-1716) in picklescan's unsafe-globals denylist, given only the vulnerable file with no hint of what's wrong."
keywords = ["security", "deserialization", "detection-evasion", "cve", "locate", "picklescan"]
[[task.authors]]
name = "ARIM Labs"

[metadata]

[verifier]
timeout_sec = 600.0
collect = []
# Scoring runs entirely against code already installed in the image.
network_mode = "no-network"

[verifier.env]

[agent]
timeout_sec = 600.0
# Cuts internet access while the model is solving the task, so it can't
# route around the "locate" condition (no vuln description given) by
# just searching for the CVE advisory instead of reviewing the code.
# Does not affect the Docker build step, which happens before this
# phase and needs network to clone the pinned upstream commit.
network_mode = "no-network"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
