schema_version = "1.4"
artifacts = []

[task]
name = "arim/scitokens_sqli"
version = "1.0.0"
description = "Locate and fix the real SQL injection (CVE-2026-32714) in scitokens' KeyCache, given only the vulnerable file with no hint of what's wrong."
keywords = ["security", "sql-injection", "cve", "locate", "scitokens"]
[[task.authors]]
name = "ARIM Labs"

[metadata]

[verifier]
timeout_sec = 600.0
collect = []
# Scoring runs entirely against code already installed in the image.
network_mode = "no-network"

[verifier.env]

[agent]
timeout_sec = 600.0
# Cuts internet access while the model is solving the task, so it can't
# route around the "locate" condition (no vuln description given) by
# just searching for the CVE advisory instead of reviewing the code.
# Does not affect the Docker build step, which happens before this
# phase and needs network to clone the pinned upstream commit.
network_mode = "no-network"

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
